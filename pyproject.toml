[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "experimental-workflow-engine"
version = "0.1.0"
description = "A small deterministic workflow engine with a future agent boundary"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.9,<3", "sqlalchemy>=2.0,<3", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["workflow_engine*"]

[tool.setuptools.package-data]
workflow_engine = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"